name: Security and regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dcm-front/package-lock.json
      - name: Install Python runtime and audit tools
        run: |
          python -m pip install --upgrade pip==26.2.0
          python -m pip install -r dcm-back/requirements.txt bandit==1.9.4 pip-audit==2.10.1
          python -m pip check
      - name: Secret scan of all reachable Git history
        run: |
          python scripts/install_gitleaks.py "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --log-opts="--all" --redact --no-banner
      - name: Static security gate
        run: bandit -r dcm-back/app model-training scripts -ll
      - name: Python known-vulnerability audit
        run: pip-audit --local --skip-editable
      - name: Security regression tests
        run: python scripts/run_checks.py --suite security
      - name: Start disposable PostgreSQL and pgvector
        shell: bash
        run: |
          db_password="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$db_password"
          docker run --detach --name complaintai-security-db --publish 127.0.0.1:6543:5432 --env POSTGRES_PASSWORD="$db_password" pgvector/pgvector:pg17
          for attempt in {1..30}; do
            if docker exec complaintai-security-db pg_isready -U postgres; then break; fi
            sleep 2
          done
          echo "TEST_DATABASE_URL=postgresql://postgres:$db_password@127.0.0.1:6543/postgres" >> "$GITHUB_ENV"
      - name: Backend tests against isolated DB
        run: python scripts/run_checks.py --suite unit
      - name: Frontend install and known-vulnerability audit
        working-directory: dcm-front
        run: |
          npm ci
          npm audit --audit-level=low
      - name: Current-contract frontend regression and build
        working-directory: dcm-front
        run: |
          npm test
          npm run build
      - name: Stop disposable DB
        if: always()
        run: docker rm -f complaintai-security-db || true
